name: A6 walk Kaggle competition file pages

on:
  push:
    branches: [research]
    paths:
      - ".dispatch/audit-a6-kaggle-pages-sdk.txt"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade kaggle
      - name: Walk pages until train files appear
        run: |
          python - <<'PY'
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi(); api.authenticate()
          token=None
          seen=0
          for page in range(1,51):
              r=api.competition_list_files(
                  "rsna-knee-abnormality-detection",
                  page_token=token,
                  page_size=200,
              )
              files=list(getattr(r,"files",[]) or [])
              names=[getattr(x,"name","") for x in files]
              seen+=len(names)
              attrs={a:getattr(r,a) for a in dir(r) if "token" in a.lower() and not a.startswith("_")}
              print("PAGE",page,"n",len(names),"seen",seen,"token_attrs",attrs)
              if names:
                  print("FIRST",names[0])
                  print("LAST",names[-1])
              hits=[n for n in names if n=="train.csv" or n=="train_series.csv" or n.startswith("train_series/")]
              print("TRAIN_HITS",len(hits))
              for n in hits[:20]: print("HIT",n)
              if hits:
                  break
              token=(getattr(r,"next_page_token",None)
                     or getattr(r,"nextPageToken",None)
                     or getattr(r,"next_page_token_",None))
              if not token:
                  print("NO_NEXT_TOKEN; dir token attrs:",[a for a in dir(r) if "token" in a.lower()])
                  break
          PY
