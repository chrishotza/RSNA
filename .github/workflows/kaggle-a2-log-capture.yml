name: Capture EXP-A2 Kaggle traceback

on:
  push:
    branches:
      - research
    paths:
      - .dispatch/capture-exp-a2-log.txt

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_ID: chrishotza/rsna-exp-a2-dsr1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: research

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Capture traceback only
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          {
            echo "=== STATUS ==="
            kaggle kernels status "$KERNEL_ID" 2>&1 || true
            echo
            echo "=== LOGS ==="
            timeout 90s kaggle kernels logs "$KERNEL_ID" 2>&1 || true
          } | tee diagnostics/EXP-A2-v1-kaggle.log
          tail -n 250 diagnostics/EXP-A2-v1-kaggle.log

      - name: Commit captured log
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/EXP-A2-v1-kaggle.log
          if git diff --cached --quiet; then
            echo "No log diff to commit."
            exit 0
          fi
          git commit -m "Capture EXP-A2 v1 Kaggle traceback"
          git push origin HEAD:research
