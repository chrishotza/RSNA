name: A6 inspect Apex weight package

on:
  push:
    branches: [research]
    paths:
      - ".dispatch/audit-a6-apex-weight-package.txt"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade kaggle
      - name: List files
        run: |
          mkdir -p out/a6-apex-pkg
          kaggle datasets files -d nartaa/rsna-knee-publication-swa-weights-20261007 --csv | tee out/a6-apex-pkg/files.csv
      - uses: actions/upload-artifact@v4
        with:
          name: a6-apex-weight-package-audit
          retention-days: 30
          path: out/a6-apex-pkg/**
