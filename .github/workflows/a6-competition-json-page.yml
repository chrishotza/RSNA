name: A6 inspect competition page token

on:
  push:
    branches: [research]
    paths:
      - ".dispatch/audit-a6-competition-json.txt"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade kaggle
      - name: JSON first page
        run: |
          mkdir -p out/a6-comp-json
          kaggle competitions files -c rsna-knee-abnormality-detection --page-size 200 --format json > out/a6-comp-json/page1.json
          python - <<'PY'
          import json
          p="out/a6-comp-json/page1.json"
          x=json.load(open(p))
          print("type",type(x).__name__)
          if isinstance(x,dict):
              print("keys",list(x))
              print("next",x.get("nextPageToken") or x.get("next_page_token"))
              arr=x.get("files") or x.get("items") or []
          else:
              arr=x
          print("n",len(arr))
          for r in arr[:20]:
              print(r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a6-competition-json-page
          retention-days: 30
          path: out/a6-comp-json/**
