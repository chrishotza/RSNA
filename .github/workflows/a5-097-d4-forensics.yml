name: A5 097 D4 forensic extraction

on:
  push:
    branches:
      - research
    paths:
      - .dispatch/extract-a5-d4-forensics.txt

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Pull sources
        run: |
          set -euo pipefail
          mkdir -p out/d4 out/gate
          kaggle kernels pull pjmathematician/rsna-knee-d4-lite -p out/d4 -m
          kaggle kernels pull dariushafshar/rsna-blend-gate-harness-58-golds-12-targets -p out/gate -m

      - name: Extract exact constants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path

          def code(root):
              p=next(Path(root).glob("*.ipynb"))
              nb=json.loads(p.read_text())
              return "\n".join("".join(c.get("source",[])) for c in nb["cells"] if c.get("cell_type")=="code")

          d4=code("out/d4")
          gate=code("out/gate")
          specs=[
              ("coatnet_final_weights", d4, r"_coatnet_weight\s*=\s*\{label:\s*0\.60\s*for\s*label\s*in\s*_blend_labels\}\s*_coatnet_weight\.update\((\{.*?\})\)"),
              ("legacy_member_weight_by_target", d4, r"LEGACY_MEMBER_WEIGHT_BY_TARGET\s*=\s*(\{.*?\})"),
              ("legacy_fold_softpool_alpha", d4, r"LEGACY_FOLD_SOFTPOOL_ALPHA\s*=\s*(\{.*?\})"),
              ("select_rule", gate, r"SELECT_RULE\s*=\s*([0-9.]+)"),
              ("n_boot", gate, r"N_BOOT\s*=\s*([0-9]+)"),
              ("boot_alias", gate, r"BOOT\s*=\s*([0-9]+)"),
              ("ours_weight", d4, r"_OV_W\s*=\s*float\([^\n]+"),
              ("students_weight", d4, r"_OV_W2\s*=\s*float\([^\n]+"),
          ]
          print("===== EXACT CONSTANTS =====")
          for name,src,pat in specs:
              m=re.search(pat,src,re.S)
              print(f"\n{name}:")
              print(m.group(0)[:5000] if m else "NOT FOUND")

          for needle in ["d4_zones","global96","repairv1","resgated","private_alpha"]:
              print(f"\n===== {needle} contexts =====")
              pos=0;n=0
              while True:
                  pos=d4.find(needle,pos)
                  if pos<0 or n>=8: break
                  print(d4[max(0,pos-600):min(len(d4),pos+1600)])
                  pos+=len(needle);n+=1
          PY
