name: A6 analyze D4 gold reference

on:
  push:
    branches: [research]
    paths:
      - ".dispatch/analyze-a6-d4-gold.txt"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade kaggle numpy scikit-learn
      - name: Download
        run: |
          mkdir -p out/a6-d4-analysis
          kaggle datasets download -d mattiaangeli/rsna-knee-coatnet-d4-depthzone-swa3-b2 -f d4_gold58_reference.npz -p out/a6-d4-analysis --unzip
      - name: Analyze
        run: python scripts/analyze_d4_gold_reference.py out/a6-d4-analysis/d4_gold58_reference.npz --out out/a6-d4-analysis/report.json --bootstrap 10000
      - uses: actions/upload-artifact@v4
        with:
          name: a6-d4-gold-analysis
          retention-days: 30
          path: out/a6-d4-analysis/**
