name: A5 D4 ConvNeXt hybrid map

on:
  push:
    branches:
      - research
    paths:
      - .dispatch/map-a5-d4-convnext.txt

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Pull both public notebooks
        run: |
          mkdir -p out/d4 out/cnxt
          kaggle kernels pull pjmathematician/rsna-knee-d4-lite -p out/d4 -m
          kaggle kernels pull goodpjw2008/rsna-knee-stack-2-5d-convnext-mil-lb-0-944 -p out/cnxt -m
      - name: Map executable cells and staging contracts
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path

          def inspect(root,name):
              p=next(Path(root).glob("*.ipynb"))
              nb=json.loads(p.read_text())
              print(f"===== {name} {p.name} cells={len(nb['cells'])} =====")
              for i,c in enumerate(nb["cells"]):
                  if c.get("cell_type")!="code": continue
                  s="".join(c.get("source",[]))
                  markers=[]
                  for x in [
                      "_pipeline_stage.csv","submission.csv","RUN_STACK",
                      "OWN_W","cnxt_v0_fold0.pt","convnext_tiny",
                      "Community stack","Our reader","Rank blend",
                      "_RSNA_LABELS","_RSNA_TEST_IDS","publish","to_csv"
                  ]:
                      if x in s: markers.append(x)
                  first=next((ln.strip() for ln in s.splitlines() if ln.strip()),"")[:180]
                  print(json.dumps({"cell":i,"lines":len(s.splitlines()),"first":first,"markers":markers}))
                  if markers:
                      print(s[:5000])
                      print("---")
          inspect("out/d4","D4")
          inspect("out/cnxt","CNXT")
          PY
