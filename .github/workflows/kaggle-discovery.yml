name: Kaggle source discovery

on:
  push:
    branches:
      - main
      - research
  workflow_dispatch:
  pull_request:
  pull_request_target:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install current Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Verify Kaggle authentication and API access
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || {
            echo "::error::KAGGLE_API_TOKEN is not available to this workflow."
            exit 2
          }
          kaggle datasets list --user tejuuss --sort-by updated -v >/tmp/kaggle_auth_probe.txt
          cat /tmp/kaggle_auth_probe.txt

      - name: Search candidate datasets
        run: |
          set +e
          {
            echo "=== search: rsna knee arm ==="
            kaggle datasets list -s "rsna knee arm" --sort-by updated -v
            echo
            echo "=== search: armA_fold0.pt ==="
            kaggle datasets list -s "armA_fold0.pt" --sort-by updated -v
            echo
            echo "=== search: armB_fold0.pt ==="
            kaggle datasets list -s "armB_fold0.pt" --sort-by updated -v
            echo
            echo "=== search: tejuuss ==="
            kaggle datasets list --user tejuuss --sort-by updated -v
          } 2>&1 | tee kaggle-datasets-search.txt
          exit 0

      - name: Probe related public checkpoint datasets
        shell: bash
        run: |
          set +e
          : > kaggle-related-files.txt
          for ref in \
            stevenleehans/rsna-knee-champ-members-only \
            stevenleehans/rsna-knee-llm199-e30-members \
            damoonshahhosseini/ct02-teacher-blend-coatnet-checkpoint
          do
            echo "=== $ref ===" | tee -a kaggle-related-files.txt
            kaggle datasets files "$ref" --page-size 200 -v 2>&1 | tee -a kaggle-related-files.txt
          done
          echo '=== checkpoint filename matches ===' | tee -a kaggle-related-files.txt
          grep -Ei 'armA_fold|armB_fold|\.pt|\.pth|checkpoint|weights' kaggle-related-files.txt | tee kaggle-related-matches.txt || true

      - name: Search training kernels and known slugs
        shell: bash
        run: |
          set +e
          {
            echo '=== kernels: arma f01234 ==='
            kaggle kernels list -s 'rsna-knee-arma-f01234' --sort-by updated -v
            echo '=== kernels: armb f01234 ==='
            kaggle kernels list -s 'rsna-knee-armb-f01234' --sort-by updated -v
            echo '=== kernels: arm ckpt ==='
            kaggle kernels list -s 'rsna-knee arm checkpoint' --sort-by updated -v
          } 2>&1 | tee kaggle-kernel-search.txt

      - name: Inspect canonical checkpoint dataset
        id: canonical
        shell: bash
        run: |
          set +e
          kaggle datasets files tejuuss/rsna-knee-arm-ckpts --page-size 200 -v 2>&1 | tee kaggle-canonical-files.txt
          rc=${PIPESTATUS[0]}

          echo "kaggle datasets files exit code: $rc"
          grep -E 'armA_fold[0-4]\.pt|armB_fold[0-4]\.pt' kaggle-canonical-files.txt | tee kaggle-canonical-matches.txt || true

          if [ "$(wc -l < kaggle-canonical-matches.txt)" -ge 10 ]; then
            echo "SOURCE_OK=1" >> "$GITHUB_OUTPUT"
          else
            echo "SOURCE_OK=0" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Download canonical checkpoints when available
        if: steps.canonical.outputs.SOURCE_OK == '1'
        run: |
          set -euo pipefail
          rm -rf ckpt_ds
          mkdir -p ckpt_ds
          kaggle datasets download tejuuss/rsna-knee-arm-ckpts -p ckpt_ds --unzip -o

          echo "=== checkpoint files ==="
          find ckpt_ds -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

          echo "=== hashes ==="
          find ckpt_ds -type f -name 'arm[AB]_fold[0-4].pt' -print0 |
            sort -z |
            xargs -0 sha256sum |
            tee kaggle-checkpoint-sha256.txt

      - name: Write recovery status
        if: always()
        run: |
          {
            echo "## Kaggle checkpoint discovery"
            echo
            if [ -f kaggle-canonical-matches.txt ] && [ "$(wc -l < kaggle-canonical-matches.txt)" -ge 10 ]; then
              echo "Canonical dataset tejuuss/rsna-knee-arm-ckpts is accessible and contains all 10 expected checkpoints."
            else
              echo "Canonical dataset tejuuss/rsna-knee-arm-ckpts was not confirmed to contain all 10 expected checkpoints."
            fi
            echo
            echo "See the raw discovery logs in the workflow artifact."
          } > kaggle-recovery-status.md

      - name: Upload discovery logs and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-discovery
          if-no-files-found: warn
          retention-days: 7
          path: |
            kaggle-datasets-search.txt
            kaggle-canonical-files.txt
            kaggle-canonical-matches.txt
            kaggle-checkpoint-sha256.txt
            kaggle-recovery-status.md
            ckpt_ds/**