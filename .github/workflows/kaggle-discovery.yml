name: Kaggle source discovery

on:
  push:
    branches:
      - research
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Verify Kaggle authentication
        run: kaggle auth whoami

      - name: Search Kaggle datasets
        run: |
          set -o pipefail
          kaggle datasets list -s "rsna knee arm" --sort-by "updated" | tee kaggle-datasets.txt
          echo "--- exact armA/armB searches ---"
          kaggle datasets list -s "armA_fold" --sort-by "updated" | tee -a kaggle-datasets.txt || true
          kaggle datasets list -s "armB_fold" --sort-by "updated" | tee -a kaggle-datasets.txt || true

      - name: Search Kaggle notebooks
        run: |
          set -o pipefail
          kaggle kernels list -s "RSNA Knee" --sort-by "updated" | tee kaggle-notebooks.txt

      - name: Inspect original repository references
        run: |
          grep -RniE 'rsna-knee-arm-ckpts|armA_fold|armB_fold' . | head -200 || true

      - name: Upload discovery logs
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-discovery
          path: |
            kaggle-datasets.txt
            kaggle-notebooks.txt
