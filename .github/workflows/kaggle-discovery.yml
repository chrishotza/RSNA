name: Kaggle source discovery

on:
  push:
    branches:
      - main
      - research
  workflow_dispatch:
  pull_request:
  pull_request_target:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install current Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Verify Kaggle authentication and API access
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || {
            echo "::error::KAGGLE_API_TOKEN is not available to this workflow."
            exit 2
          }
          kaggle datasets list --user tejuuss --sort-by updated -v >/tmp/kaggle_auth_probe.txt
          cat /tmp/kaggle_auth_probe.txt

      - name: Search candidate datasets
        run: |
          set +e
          {
            echo "=== search: rsna knee arm ==="
            kaggle datasets list -s "rsna knee arm" --sort-by dateRun -v
            echo
            echo "=== search: armA_fold0.pt ==="
            kaggle datasets list -s "armA_fold0.pt" --sort-by dateRun -v
            echo
            echo "=== search: armB_fold0.pt ==="
            kaggle datasets list -s "armB_fold0.pt" --sort-by dateRun -v
            echo
            echo "=== search: tejuuss ==="
            kaggle datasets list --user tejuuss --sort-by updated -v
          } 2>&1 | tee kaggle-datasets-search.txt
          exit 0

      - name: Probe related public checkpoint datasets
        shell: bash
        run: |
          set +e
          : > kaggle-related-files.txt
          for ref in \
            stevenleehans/rsna-knee-champ-members-only \
            stevenleehans/rsna-knee-llm199-e30-members \
            damoonshahhosseini/ct02-teacher-blend-coatnet-checkpoint
          do
            echo "=== $ref ===" | tee -a kaggle-related-files.txt
            kaggle datasets files "$ref" --page-size 200 -v 2>&1 | tee -a kaggle-related-files.txt
          done
          echo '=== checkpoint filename matches ===' | tee -a kaggle-related-files.txt
          grep -Ei 'armA_fold|armB_fold|\.pt|\.pth|checkpoint|weights' kaggle-related-files.txt | tee kaggle-related-matches.txt || true

      - name: Search training kernels and known slugs
        shell: bash
        run: |
          set +e
          {
            echo '=== kernels: arma f01234 ==='
            kaggle kernels list -s 'rsna-knee-arma-f01234' --sort-by dateRun -v
            echo '=== kernels: armb f01234 ==='
            kaggle kernels list -s 'rsna-knee-armb-f01234' --sort-by dateRun -v
            echo '=== kernels: arm ckpt ==='
            kaggle kernels list -s 'rsna-knee arm checkpoint' --sort-by dateRun -v
          } 2>&1 | tee kaggle-kernel-search.txt

      - name: Download candidate checkpoint families
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidates/champ candidates/llm199
          kaggle datasets download stevenleehans/rsna-knee-champ-members-only -p candidates/champ --unzip -o
          kaggle datasets download stevenleehans/rsna-knee-llm199-e30-members -p candidates/llm199 --unzip -o
          echo "=== candidate files ==="
          find candidates -type f -name '*.pt' -printf '%p %s bytes\n' | sort
          echo "=== candidate hashes ==="
          find candidates -type f -name '*.pt' -print0 | sort -z | xargs -0 sha256sum | tee candidate-checkpoint-sha256.txt

      - name: Inspect candidate checkpoint structures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet torch
          python - <<'PY'
          import glob, json, os, torch
          rows=[]
          for p in sorted(glob.glob("candidates/**/*.pt", recursive=True)):
              obj=torch.load(p, map_location="cpu", weights_only=False)
              info={"path":p, "type":type(obj).__name__}
              if isinstance(obj, dict):
                  info["keys"]=sorted(map(str,obj.keys()))[:40]
                  sd=obj.get("state_dict", obj.get("model_state_dict", obj))
                  if isinstance(sd, dict):
                      keys=list(map(str,sd.keys()))
                      info["state_dict_key_count"]=len(keys)
                      info["state_dict_head"]=keys[:30]
              rows.append(info)
          print(json.dumps(rows, indent=2))
          open("candidate-structures.json","w").write(json.dumps(rows, indent=2))
          PY

      - name: Probe original kernels
        shell: bash
        run: |
          set +e
          {
            echo '=== tejuuss/rsna-knee-armA-f01234 ==='
            kaggle kernels status tejuuss/rsna-knee-armA-f01234 -v
            echo '=== tejuuss/rsna-knee-armB-f01234 ==='
            kaggle kernels status tejuuss/rsna-knee-armB-f01234 -v
            echo '=== search armA ==='
            kaggle kernels list -s 'rsna-knee-armA-f01234' --sort-by dateRun -v
            echo '=== search armB ==='
            kaggle kernels list -s 'rsna-knee-armB-f01234' --sort-by dateRun -v
          } 2>&1 | tee kaggle-original-kernels.txt
          exit 0

      - name: Inspect canonical checkpoint dataset
        id: canonical
        shell: bash
        run: |
          set +e
          kaggle datasets files tejuuss/rsna-knee-arm-ckpts --page-size 200 -v 2>&1 | tee kaggle-canonical-files.txt
          rc=${PIPESTATUS[0]}

          echo "kaggle datasets files exit code: $rc"
          grep -E 'armA_fold[0-4]\.pt|armB_fold[0-4]\.pt' kaggle-canonical-files.txt | tee kaggle-canonical-matches.txt || true

          if [ "$(wc -l < kaggle-canonical-matches.txt)" -ge 10 ]; then
            echo "SOURCE_OK=1" >> "$GITHUB_OUTPUT"
          else
            echo "SOURCE_OK=0" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Download canonical checkpoints when available
        if: steps.canonical.outputs.SOURCE_OK == '1'
        run: |
          set -euo pipefail
          rm -rf ckpt_ds
          mkdir -p ckpt_ds
          kaggle datasets download tejuuss/rsna-knee-arm-ckpts -p ckpt_ds --unzip -o

          echo "=== checkpoint files ==="
          find ckpt_ds -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

          echo "=== hashes ==="
          find ckpt_ds -type f -name 'arm[AB]_fold[0-4].pt' -print0 |
            sort -z |
            xargs -0 sha256sum |
            tee kaggle-checkpoint-sha256.txt

      - name: Write recovery status
        if: always()
        run: |
          {
            echo "## Kaggle checkpoint discovery"
            echo
            if [ -f kaggle-canonical-matches.txt ] && [ "$(wc -l < kaggle-canonical-matches.txt)" -ge 10 ]; then
              echo "Canonical dataset tejuuss/rsna-knee-arm-ckpts is accessible and contains all 10 expected checkpoints."
            else
              echo "Canonical dataset tejuuss/rsna-knee-arm-ckpts was not confirmed to contain all 10 expected checkpoints."
            fi
            echo
            echo "See the raw discovery logs in the workflow artifact."
          } > kaggle-recovery-status.md

      - name: Upload discovery logs and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-discovery
          if-no-files-found: warn
          retention-days: 7
          path: |
            kaggle-datasets-search.txt
            kaggle-canonical-files.txt
            kaggle-canonical-matches.txt
            kaggle-checkpoint-sha256.txt
            kaggle-recovery-status.md
            ckpt_ds/**
  a6_kaggle_push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'PUBLISH A6')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research
      - name: Build A6 Kaggle notebook
        run: |
          git clone --depth 1 https://github.com/mathischmp/challenge_rsna.git external
          python -m pip install -q --upgrade kaggle
          python scripts/a6_make_kaggle_notebook.py .
          mkdir -p a6_push
          cp kaggle/a6_teacher_export/a6_smoke.ipynb a6_push/
          python - <<'PY'
          import json
          data={"id":"chrishotza/rsna-a6-raptor-full-teacher-v2",
                "title":"RSNA A6 Raptor Full Teacher V2",
                "code_file":"a6_smoke.ipynb",
                "language":"python","kernel_type":"notebook",
                "is_private":True,"enable_gpu":True,"enable_internet":True,
                "competition_sources":["rsna-knee-abnormality-detection"],
                "dataset_sources":["dreaddevelopment/raptor-knee-maxspan"]}
          with open("a6_push/kernel-metadata.json","w") as f: json.dump(data,f)
          PY
      - name: Push notebook to Kaggle
        run: |
          set -o pipefail
          kaggle kernels push -p a6_push 2>&1 | tee kaggle-a6-push.log
      - name: Archive Kaggle push result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-push-proof
          if-no-files-found: warn
          path: |
            kaggle-a6-push.log
            a6_push/kernel-metadata.json

  a6_verify_full:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Install Kaggle CLI
        run: python -m pip install -q --upgrade kaggle
      - name: Check final teacher run status and files
        shell: bash
        run: |
          set +e
          mkdir -p a6_status
          kaggle kernels status chrishotza/rsna-a6-raptor-full-teacher-v2 > a6_status/status.txt 2>&1
          status_rc=$?
          echo "status_exit=$status_rc" >> a6_status/status.txt
          kaggle kernels output chrishotza/rsna-a6-raptor-full-teacher-v2 -p a6_status/output > a6_status/output-fetch.txt 2>&1
          output_rc=$?
          echo "output_exit=$output_rc" >> a6_status/output-fetch.txt
          find a6_status/output -maxdepth 3 -type f -printf '%P %s bytes\\n' > a6_status/output-files.txt 2>/dev/null || true
          cat a6_status/status.txt
          cat a6_status/output-files.txt
          cat a6_status/output-fetch.txt | tail -25
          if [ "$status_rc" -ne 0 ] || [ "$output_rc" -ne 0 ]; then exit 1; fi
          exit 0
      - name: Validate actual 4349-row teacher CSV
        run: |
          python - <<'PY'
          import csv,json,math
          from pathlib import Path
          d=Path("a6_status/output/a6_result")
          csvpath=d/"a6_raptor_v5_visual.csv"
          manifest=json.loads((d/"a6_raptor_v5_manifest.json").read_text())
          targets=["ACL","MCL","Medial Meniscus","Lateral Meniscus",
                   "Medial OA","Lateral OA","PF OA","Effusion",
                   "Synovitis","Baker's","Contusion","Fracture"]
          with csvpath.open(newline="",encoding="utf-8") as fp:
              reader=csv.DictReader(fp)
              assert reader.fieldnames==["StudyInstanceUID",*targets],reader.fieldnames
              seen=set()
              for row in reader:
                  uid=row["StudyInstanceUID"]
                  assert uid and uid not in seen,uid
                  seen.add(uid)
                  for key in targets:
                      p=float(row[key])
                      assert math.isfinite(p) and 0<=p<=1,(uid,key,p)
          assert len(seen)==4349,len(seen)
          assert manifest["studies"]==4349,manifest
          assert manifest["gold_excluded"]==58,manifest
          assert manifest["no_fallbacks"] is True,manifest
          result={"status":"VALID","studies":len(seen),"targets":12,
                  "gold_excluded":58,"teacher":manifest["teacher"],
                  "sha256":manifest["sha256"]}
          (Path("a6_status")/"a6_validation.json").write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Upload teacher completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-full-teacher-status
          if-no-files-found: warn
          path: a6_status/
