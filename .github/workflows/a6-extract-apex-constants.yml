name: A6 extract Apex 0950 constants

on:
  push:
    branches: [research]
    paths:
      - ".dispatch/extract-a6-apex-constants.txt"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Pull Apex
        run: |
          mkdir -p out/apex
          kaggle kernels pull sujanmajhisuzan/rsna-knee-apex-grandmaster-stack -p out/apex -m
      - name: Extract constants
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=next(Path("out/apex").glob("*.ipynb"))
          nb=json.loads(p.read_text())
          code="\n".join("".join(c.get("source",[])) for c in nb["cells"] if c.get("cell_type")=="code")
          needles=[
            "TARGET_WEIGHTS = {",
            "WEIGHTS = {",
            "ARMS = [",
            "raptor_ft_alldata_t16_blendjev_oai_d96_r384_swa.pt",
            "EXPANDED 4,349-study corpus",
            "CoAtNet 384px (0.949)",
            "Target-Specific Calibrated Rank Fusion",
            "ConvNeXt strengths on",
          ]
          for n in needles:
              print("\n===== "+n+" =====")
              pos=0;k=0
              while True:
                  pos=code.find(n,pos)
                  if pos<0 or k>=8: break
                  print(code[max(0,pos-2200):min(len(code),pos+7000)])
                  pos+=len(n);k+=1
          PY
