name: Kaggle EXP-A3 single controlled submission v2

on:
  push:
    branches:
      - research
    paths:
      - .dispatch/submit-exp-a3-v2.txt

concurrency:
  group: rsna-kaggle-exp-a3-v2
  cancel-in-progress: true

jobs:
  a3:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      COMPETITION: rsna-knee-abnormality-detection
      KERNEL_ID: chrishotza/rsna-exp-a3-rank-submit
      SUBMISSION_MESSAGE: "EXP-A3 | A3-RANK independent model | rank-first target-router | v2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Duplicate-submission guard
        id: guard
        run: |
          set -euo pipefail
          mkdir -p out/a3
          kaggle competitions submissions "$COMPETITION" -v -q > out/a3/submissions-preflight.csv
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          target=os.environ["SUBMISSION_MESSAGE"]
          rows=list(csv.DictReader(Path("out/a3/submissions-preflight.csv").open()))
          matches=[r for r in rows if str(r.get("description","") or "").strip()==target]
          Path("out/a3/preexisting.json").write_text(json.dumps(matches,indent=2))
          Path(os.environ["GITHUB_OUTPUT"]).write_text(
              "already_exists="+("true" if matches else "false")+"\n", encoding="utf-8")
          if matches:
              print("A3 already exists; no duplicate push/submit.")
          else:
              print("No prior A3 v2 submission. Guard passed.")
          PY

      - name: Build A3 Kaggle bundle
        if: steps.guard.outputs.already_exists != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/a3/src out/a3
          cp notebooks/experiments/EXP-A3-rank-submit.py build/a3/a3-rank-submit.py
          cp src/a3_uam_seq.py build/a3/src/a3_uam_seq.py
          cp src/a3_feature_bank.py build/a3/src/a3_feature_bank.py
          cp src/a3_training.py build/a3/src/a3_training.py
          touch build/a3/src/__init__.py

          python -m py_compile             build/a3/a3-rank-submit.py             build/a3/src/a3_uam_seq.py             build/a3/src/a3_feature_bank.py             build/a3/src/a3_training.py

          cat > build/a3/kernel-metadata.json <<'JSON'
          {
            "id": "chrishotza/rsna-exp-a3-rank-submit",
            "title": "rsna-exp-a3-rank-submit",
            "code_file": "a3-rank-submit.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": false,
            "keywords": ["gpu","health"],
            "dataset_sources": [
              "marwanmath/resnet-50-radimagenet-marwan",
              "pilkwang/rsna-knee-llm-labels"
            ],
            "competition_sources": [
              "rsna-knee-abnormality-detection"
            ],
            "model_sources": [],
            "machine_shape": "NvidiaTeslaT4"
          }
          JSON

      - name: Push EXP-A3 once
        if: steps.guard.outputs.already_exists != 'true'
        run: |
          set -euo pipefail
          set +e
          kaggle kernels push -p build/a3 2>&1 | tee out/a3/kernel-push.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Kaggle A3 kernel push failed (rc=$rc); no competition submission attempted."
            exit "$rc"
          fi
          kernel_version="$(sed -n 's/.*Kernel version \([0-9][0-9]*\) successfully pushed.*/\1/p' out/a3/kernel-push.txt | tail -n 1)"
          test -n "$kernel_version" || { echo "Cannot recover A3 kernel version; stopping."; exit 1; }
          echo "kernel_version=$kernel_version" >> "$GITHUB_ENV"
          echo "$kernel_version" > out/a3/kernel-version.txt

      - name: Wait for EXP-A3 kernel run
        if: steps.guard.outputs.already_exists != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            set +e
            status="$(kaggle kernels status "$KERNEL_ID" 2>&1)"
            rc=$?
            set -e
            echo "[$i] $status"
            printf '%s\n' "$status" > out/a3/kernel-status-latest.txt
            case "$status" in
              *"KernelWorkerStatus.COMPLETE"*|*"status \"complete\""*|*"COMPLETE"*) exit 0 ;;
              *"KernelWorkerStatus.ERROR"*|*"KernelWorkerStatus.FAILED"*|*"status \"error\""*|*"FAILED"*) echo "A3 kernel failed; no submit."; exit 1 ;;
            esac
            if [ "$rc" -ne 0 ]; then echo "status rc=$rc"; fi
            sleep 60
          done
          echo "Timed out; no submit."
          exit 1

      - name: Submit EXP-A3 exactly once
        if: steps.guard.outputs.already_exists != 'true'
        run: |
          set -euo pipefail
          kaggle competitions submissions "$COMPETITION" -v -q > out/a3/submissions-before-submit.csv
          python - <<'PY'
          import csv, os, sys
          from pathlib import Path
          target=os.environ["SUBMISSION_MESSAGE"]
          rows=list(csv.DictReader(Path("out/a3/submissions-before-submit.csv").open()))
          for row in rows:
              if str(row.get("description","") or "").strip()==target:
                  print("DUPLICATE GUARD:",row)
                  sys.exit(9)
          PY

          set +e
          kaggle competitions submit "$COMPETITION"             -k "$KERNEL_ID"             -v "$kernel_version"             -f submission.csv             -m "$SUBMISSION_MESSAGE"             2>&1 | tee out/a3/submission-submit.txt
          submit_rc=${PIPESTATUS[0]}
          set -e
          echo "submit_rc=$submit_rc" > out/a3/submit-return-code.txt

          found=false
          for i in $(seq 1 20); do
            kaggle competitions submissions "$COMPETITION" -v -q > out/a3/submissions-after-submit.csv
            set +e
            python - <<'PY'
          import csv, json, os, sys
          from pathlib import Path
          target=os.environ["SUBMISSION_MESSAGE"]
          rows=list(csv.DictReader(Path("out/a3/submissions-after-submit.csv").open()))
          matches=[r for r in rows if str(r.get("description","") or "").strip()==target]
          if not matches:
              sys.exit(10)
          def key(r):
              return str(r.get("date","") or r.get("submitted","") or "")+"|"+str(r.get("ref","") or r.get("id",""))
          row=sorted(matches,key=key)[-1]
          ref=str(row.get("ref","") or row.get("id","")).strip()
          if not ref.isdigit():
              print("No numeric ref:",row); sys.exit(11)
          Path("out/a3/submission-ref.txt").write_text(ref+"\n")
          Path("out/a3/submission-initial-status.json").write_text(json.dumps(row,indent=2))
          print("A3 submission ref:",ref)
          print("status:",row.get("status"))
          print("public score:",row.get("publicScore","pending"))
          PY
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then found=true; break; fi
            if [ "$rc" -ne 10 ]; then exit 1; fi
            sleep 30
          done
          if [ "$found" != true ]; then
            echo "Submission invoked once but ref not visible. DO NOT RESUBMIT."
            exit 1
          fi

      - name: Archive EXP-A3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-a3-v2-single-submission
          retention-days: 30
          if-no-files-found: warn
          path: |
            out/a3/**
            build/a3/**
