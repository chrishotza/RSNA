name: A6 inspect D4 gold reference package

on:
  push:
    branches: [research]
    paths:
      - ".dispatch/audit-a6-d4-gold-package.txt"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade kaggle
      - name: List files
        run: |
          mkdir -p out/a6-d4-gold
          kaggle datasets files -d mattiaangeli/rsna-knee-coatnet-d4-depthzone-swa3-b2 --csv | tee out/a6-d4-gold/files.csv
          grep -Ei "gold58|reference|audit|manifest|prediction|receipt|npz|json" out/a6-d4-gold/files.csv || true
      - uses: actions/upload-artifact@v4
        with:
          name: a6-d4-gold-files
          retention-days: 30
          path: out/a6-d4-gold/**
