name: RSNA read-only submission status audit

on:
  workflow_dispatch:
  push:
    branches:
      - research
    paths:
      - .dispatch/a0-audit.txt

concurrency:
  group: rsna-read-only-submission-status
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      COMPETITION: rsna-knee-abnormality-detection

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Query existing submission history only
        run: |
          set -euo pipefail
          mkdir -p out/status
          echo "READ-ONLY AUDIT: this workflow never runs kernels and never calls competitions submit."
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("experiments/queue/active.json").read_text(encoding="utf-8"))
          ref=str(q.get("submission_ref","")).strip()
          if not ref.isdigit():
              raise SystemExit(f"Queue has no numeric submission_ref: {ref!r}")
          Path("out/status/ref.txt").write_text(ref+"\n")
          Path("out/status/queue-snapshot.json").write_text(json.dumps(q,indent=2))
          print("Experiment:",q.get("experiment_id"))
          print("Submission ref:",ref)
          PY

          kaggle competitions submissions "$COMPETITION" -v -q > out/status/submissions-history.csv

          python - <<'PY'
          import csv, json
          from pathlib import Path
          ref=Path("out/status/ref.txt").read_text().strip()
          rows=list(csv.DictReader(Path("out/status/submissions-history.csv").open()))

          def field(row,*names):
              low={str(k).lower():v for k,v in row.items()}
              for name in names:
                  value=low.get(name.lower())
                  if value is not None and str(value).strip():
                      return str(value).strip()
              return ""

          matches=[row for row in rows if field(row,"ref","id","submissionref","submission_ref")==ref]
          if not matches:
              raise SystemExit(f"Ref {ref} was not found in Kaggle submission history.")
          row=matches[-1]
          status={
              "submission_ref":ref,
              "status":field(row,"status","submissionstatus"),
              "public_score":field(row,"publicScore","public_score"),
              "private_score":field(row,"privateScore","private_score"),
              "date":field(row,"date","submitted","submissiondate"),
              "description":field(row,"description","message"),
          }
          Path("out/status/status.json").write_text(json.dumps(status,indent=2),encoding="utf-8")
          print(json.dumps(status,indent=2))
          PY

      - name: Archive read-only status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsna-submission-status
          retention-days: 30
          if-no-files-found: warn
          path: out/status/**
