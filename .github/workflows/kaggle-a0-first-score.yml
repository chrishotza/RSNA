name: Kaggle A0 score audit

on:
  workflow_dispatch:
  push:
    branches:
      - research
    paths:
      - .dispatch/a0-audit.txt

concurrency:
  group: rsna-a0-score-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      A0_MESSAGE: "A0 parent baseline recovery — first external calibration score"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Discover existing A0 submissions only
        run: |
          set -euo pipefail
          mkdir -p out/a0
          echo "AUDIT ONLY: this workflow does not push, run, or submit any Kaggle notebook."
          kaggle competitions submissions rsna-knee-abnormality-detection -v -q > out/a0/all-submissions.csv

          python - <<'PY'
          import csv, json, sys
          from pathlib import Path

          p=Path("out/a0/all-submissions.csv")
          rows=list(csv.DictReader(p.open()))
          target="A0 parent baseline recovery — first external calibration score"

          def field(row, *names):
              low={str(k).lower(): v for k,v in row.items()}
              for name in names:
                  val=low.get(name.lower())
                  if val is not None and str(val).strip():
                      return str(val).strip()
              return ""

          matches=[]
          for row in rows:
              desc=field(row,"description","title","message")
              if target in desc:
                  ref=field(row,"ref","id","submissionref","submission_ref")
                  if ref.isdigit():
                      matches.append({"ref":ref,"description":desc,"row":row})

          if not matches:
              print("No A0 submissions matched.")
              print("CSV headers:", list(rows[0].keys()) if rows else [])
              print("Sample rows:", rows[:3])
              sys.exit(2)

          # Deduplicate refs without losing order.
          dedup={}
          for item in matches:
              dedup[item["ref"]]=item
          matches=list(dedup.values())

          Path("out/a0/a0-matching-submissions.json").write_text(
              json.dumps(matches, indent=2, ensure_ascii=False)
          )
          Path("out/a0/a0-refs.txt").write_text(
              "".join(item["ref"]+"\n" for item in matches)
          )
          print("Matching A0 submissions:",len(matches))
          for item in matches:
              print("A0_REF",item["ref"])
              print("DESCRIPTION",item["description"])
          PY

      - name: Poll every existing A0 submission
        run: |
          set -euo pipefail
          mapfile -t refs < out/a0/a0-refs.txt
          test "${#refs[@]}" -gt 0

          for i in $(seq 1 720); do
            pending=0
            echo "=== audit pass $i / 720; refs=${#refs[@]} ==="

            for ref in "${refs[@]}"; do
              outfile="out/a0/status-${ref}.txt"
              set +e
              kaggle competitions submission "$ref" > "$outfile" 2>&1
              rc=$?
              set -e
              echo "--- ref $ref (CLI rc=$rc) ---"
              cat "$outfile"

              state="$(sed -n 's/^[Ss]tatus:[[:space:]]*//p' "$outfile" | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d '\r')"
              state="${state#SUBMISSIONSTATUS.}"

              if [[ "$state" == "COMPLETE" || "$state" == "SUCCEEDED" || "$state" == "SUCCESS" ]]; then
                grep -iE '^(Submission Ref|Status|Public Score|Private Score|Description|Submission Date):' "$outfile" || true
              elif [[ "$state" == "ERROR" || "$state" == "FAILED" || "$state" == "REJECTED" ]]; then
                echo "TERMINAL_FAILURE ref=$ref state=$state"
              else
                pending=$((pending+1))
                echo "STILL_PENDING ref=$ref state=${state:-UNKNOWN}"
              fi
            done

            if [ "$pending" -eq 0 ]; then
              echo "All existing A0 submissions are terminal; no new submission was created."
              exit 0
            fi

            echo "Pending A0 submissions: $pending"
            sleep 30
          done

          echo "At least one A0 submission remained pending after 12 hours."
          exit 1

      - name: Archive A0 score audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-score-audit
          retention-days: 30
          if-no-files-found: warn
          path: out/a0/**
