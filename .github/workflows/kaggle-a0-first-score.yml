name: Kaggle A0 first score

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - research

jobs:
  a0:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Resolve Kaggle owner
        id: owner
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          owner="chrishotza"
          kaggle kernels list --mine --page-size 5 -v | tee /tmp/my-kernels.csv
          grep -q "^${owner}/" /tmp/my-kernels.csv
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "Kaggle owner resolved: $owner"

      - name: Build A0 baseline notebook
        env:
          KAGGLE_OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          set -euo pipefail
          mkdir -p build/a0
          cp notebooks/A0_public_0941/rsna-knee-blend-full.ipynb build/a0/a0-parent-baseline.ipynb
          cp notebooks/A0_public_0941/kernel-metadata.json build/a0/kernel-metadata.json

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/a0/a0-parent-baseline.ipynb")
          nb=json.loads(p.read_text())
          replaced=0
          for cell in nb["cells"]:
              src="".join(cell.get("source", []))
              if "APPENDED ARM BLEND" in src:
                  cell["source"]=[
                      "# A0 RECOVERY BASELINE\n",
                      "# The documented arm checkpoints are currently unavailable from Kaggle.\n",
                      "# Preserve the untouched parent pipeline so the first external score measures\n",
                      "# the reproducible 0.940/0.941 reference path rather than a failed blend.\n",
                      "print('[A0_RECOVERY] Arm checkpoints unavailable; leaving _pipeline_stage.csv unchanged.')\n"
                  ]
                  cell["execution_count"]=None
                  cell["outputs"]=[]
                  replaced += 1
          if replaced != 1:
              raise SystemExit(f"expected exactly one arm-blend cell, found {replaced}")
          p.write_text(json.dumps(nb, indent=1, ensure_ascii=False))
          print("patched A0 arm-blend cell:", replaced)
          PY

          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("build/a0/kernel-metadata.json")
          m=json.loads(p.read_text())
          owner=os.environ["KAGGLE_OWNER"]
          m["id"]=f"{owner}/rsna-a0-parent-baseline"
          m["title"]="rsna-a0-parent-baseline"
          m["code_file"]="a0-parent-baseline.ipynb"
          m["is_private"]=True
          m["enable_gpu"]=True
          m["enable_internet"]=False
          p.write_text(json.dumps(m, indent=2))
          print(m["id"])
          print(m["title"])
          PY

          cat build/a0/kernel-metadata.json

      - name: Reuse completed A0 kernel version
        env:
          KAGGLE_OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          set -euo pipefail
          mkdir -p out/a0
          kernel="$KAGGLE_OWNER/rsna-a0-parent-baseline"
          kernel_version="2"
          echo "kernel=$kernel" >> "$GITHUB_ENV"
          echo "kernel_version=$kernel_version" >> "$GITHUB_ENV"
          echo "Reusing verified completed Kaggle kernel: $kernel/$kernel_version"
          kaggle kernels status "$kernel/$kernel_version" | tee out/a0/reused-kernel-status.txt

      - name: Verify completed A0 kernel
        run: |
          set -euo pipefail
          status="$(kaggle kernels status "$kernel/$kernel_version" 2>&1 | tail -n 1)"
          echo "$status"
          case "$status" in
            *"COMPLETE"*|*"complete"*|*"Complete"*) exit 0 ;;
            *) echo "Expected completed A0 kernel version $kernel_version, got: $status"; exit 1 ;;
          esac

      - name: Download A0 submission artifact
        run: |
          set -euo pipefail
          mkdir -p out/a0
          kaggle kernels files "$kernel/$kernel_version" -v --page-size 200 | tee out/a0/kernel-files.csv
          kaggle kernels output "$kernel/$kernel_version" -p out/a0 -o
          find out/a0 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -s out/a0/submission.csv

      - name: Submit A0 to competition and wait for public score
        run: |
          set -euo pipefail
          set +e
          kaggle competitions submit rsna-knee-abnormality-detection \
            -k "$kernel" \
            -v "$kernel_version" \
            -f submission.csv \
            -m "A0 parent baseline recovery — first external calibration score" \
            2>&1 | tee out/a0/submission-submit.txt
          submit_rc=${PIPESTATUS[0]}
          set -e

          echo "submit_rc=$submit_rc" | tee out/a0/submission-submit-rc.txt

          ref="$(sed -n 's/^Submission ref:[[:space:]]*//p' out/a0/submission-submit.txt | tail -n 1 || true)"

          if [ -z "$ref" ]; then
            echo "No submission ref returned. Recovering latest matching competition submission..."
            kaggle competitions submissions rsna-knee-abnormality-detection -v -q > out/a0/all-submissions.csv

            python - <<'PY'
          import csv, sys
          from pathlib import Path
          p=Path("out/a0/all-submissions.csv")
          rows=list(csv.DictReader(p.open()))
          target="A0 parent baseline recovery — first external calibration score"
          matches=[r for r in rows if r.get("description","").strip()==target]
          if not matches:
              print("No matching A0 submission found.")
              print("Columns:", rows[0].keys() if rows else [])
              sys.exit(2)
          def key(r):
              return r.get("submitted") or r.get("date") or r.get("submissionDate") or ""
          m=sorted(matches,key=key)[-1]
          ref=m.get("ref") or m.get("id") or m.get("submissionRef")
          print("RECOVERED_REF", ref)
          if not ref:
              print("Recovered row:",m)
              sys.exit(3)
          Path("out/a0/submission-ref.txt").write_text(str(ref)+"\n")
          PY
            ref="$(cat out/a0/submission-ref.txt)"
          fi

          test -n "$ref"
          echo "submission_ref=$ref" | tee out/a0/submission-ref.txt

          for i in $(seq 1 720); do
            status="$(kaggle competitions submission "$ref" 2>&1 | tee /tmp/a0-submission-status.txt)"
            printf '[%03d] %s\n' "$i" "$(printf '%s\n' "$status" | tr '\n' ' ' | cut -c1-500)"
            printf '%s\n' "$status" > out/a0/submission-status.txt

            if grep -qiE '^Status:[[:space:]]*COMPLETE' /tmp/a0-submission-status.txt; then
              cp /tmp/a0-submission-status.txt out/a0/submission-result.txt
              cat /tmp/a0-submission-status.txt
              exit 0
            fi

            if grep -qiE '^Status:[[:space:]]*(ERROR|FAILED)' /tmp/a0-submission-status.txt; then
              cat /tmp/a0-submission-status.txt
              exit 1
            fi

            sleep 60
          done

          echo "A0 submission did not finish scoring within 12 hours"
          exit 1

      - name: Archive first-score evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-first-score
          retention-days: 30
          if-no-files-found: warn
          path: |
            out/a0/**
            build/a0/kernel-metadata.json
