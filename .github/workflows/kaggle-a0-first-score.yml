name: Kaggle A0 score audit

on:
  workflow_dispatch:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      A0_SUBMISSION_REF: "56906411"
      A0_MESSAGE: "A0 parent baseline recovery — first external calibration score"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Audit existing A0 submissions only
        run: |
          set -euo pipefail
          mkdir -p out/a0

          echo "IMPORTANT: audit-only workflow; it will NOT create, run, or submit any Kaggle notebook."

          kaggle competitions submissions rsna-knee-abnormality-detection -v -q > out/a0/all-submissions.csv

          python - <<'PY'
          import csv, json
          from pathlib import Path

          p=Path("out/a0/all-submissions.csv")
          rows=list(csv.DictReader(p.open()))
          target="A0 parent baseline recovery — first external calibration score"

          def field(r, *names):
              for n in names:
                  v=r.get(n)
                  if v is not None and str(v).strip():
                      return str(v).strip()
              return ""

          matches=[]
          for r in rows:
              desc=field(r,"description","title","message")
              if desc == target or target in desc:
                  matches.append(r)

          print("A0 matching submissions:", len(matches))
          for r in matches:
              print({
                  "ref": field(r,"ref","id","submissionRef"),
                  "status": field(r,"status","submissionStatus"),
                  "publicScore": field(r,"publicScore","public_score","public"),
                  "submitted": field(r,"submitted","submissionDate","date","created"),
              })

          Path("out/a0/a0-matching-submissions.json").write_text(
              json.dumps(matches, indent=2, ensure_ascii=False)
          )

          target_ref="56906411"
          selected=None
          for r in matches:
              if field(r,"ref","id","submissionRef") == target_ref:
                  selected=r
                  break

          if selected:
              Path("out/a0/a0-selected.json").write_text(
                  json.dumps(selected, indent=2, ensure_ascii=False)
              )
              print("Selected A0 ref:", target_ref)
          else:
              print("WARNING: expected A0 ref 56906411 was not present in the history response.")
          PY

          kaggle competitions submission "$A0_SUBMISSION_REF" | tee out/a0/submission-status-live.txt

      - name: Poll selected A0 submission
        run: |
          set -euo pipefail
          mkdir -p out/a0

          for i in $(seq 1 720); do
            echo "=== poll $i ==="
            set +e
            status="$(kaggle competitions submission "$A0_SUBMISSION_REF" 2>&1 | tee out/a0/submission-status-live.txt)"
            rc=${PIPESTATUS[0]}
            set -e

            echo "$status"

            if grep -qiE '^Status:[[:space:]]*COMPLETE|^Status:[[:space:]]*SUBMISSIONSTATUS\.COMPLETE' out/a0/submission-status-live.txt; then
              grep -iE '^(Submission Ref|Status|Public Score|Private Score|Description|Submission Date):'                 out/a0/submission-status-live.txt | tee out/a0/final-score.txt
              exit 0
            fi

            if grep -qiE '^Status:[[:space:]]*(ERROR|FAILED|REJECTED)|^Status:[[:space:]]*SUBMISSIONSTATUS\.(ERROR|FAILED|REJECTED)' out/a0/submission-status-live.txt; then
              cat out/a0/submission-status-live.txt
              exit 1
            fi

            if [ "$rc" -ne 0 ]; then
              echo "Kaggle status query returned rc=$rc; retrying."
            fi

            sleep 30
          done

          echo "Timed out waiting for A0 ref $A0_SUBMISSION_REF"
          exit 1

      - name: Archive A0 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-score-audit
          retention-days: 30
          if-no-files-found: warn
          path: out/a0/**
