name: A5 D4 ConvNeXt hybrid dryrun

on:
  push:
    branches: [research]
    paths:
      - ".dispatch/run-a5-d4-cnxt-hybrid.txt"

jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_ID: chrishotza/rsna-a5-d4-cnxt-hybrid
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade kaggle pandas numpy
      - name: Pull
        run: |
          mkdir -p build/d4 build/cnxt build/hybrid out/hybrid
          kaggle kernels pull pjmathematician/rsna-knee-d4-lite -p build/d4 -m
          kaggle kernels pull goodpjw2008/rsna-knee-stack-2-5d-convnext-mil-lb-0-944 -p build/cnxt -m
      - name: Build
        run: python scripts/build_a5_d4_cnxt_hybrid.py --d4 build/d4 --cnxt build/cnxt --outdir build/hybrid --kernel-id "$KERNEL_ID"
      - name: Push
        run: |
          kaggle kernels push -p build/hybrid 2>&1 | tee out/hybrid/push.txt
          grep -qi "successfully pushed" out/hybrid/push.txt
      - name: Wait
        run: |
          for i in $(seq 1 150); do
            s="$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)"
            echo "[$i] $s"
            if echo "$s" | grep -q "KernelWorkerStatus.COMPLETE"; then exit 0; fi
            if echo "$s" | grep -Eq "KernelWorkerStatus.ERROR|KernelWorkerStatus.FAILED"; then exit 1; fi
            sleep 60
          done
          exit 1
      - name: Collect
        run: |
          mkdir -p out/hybrid/output
          kaggle kernels output "$KERNEL_ID" -p out/hybrid/output -o
          kaggle kernels logs "$KERNEL_ID" > out/hybrid/kernel.log 2>&1 || true
          cp build/hybrid/build_audit.json out/hybrid/
          python scripts/verify_a5_hybrid_outputs.py --root out/hybrid/output --out out/hybrid/verification.json
      - name: Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-d4-cnxt-hybrid-dryrun
          retention-days: 30
          path: out/hybrid/**
